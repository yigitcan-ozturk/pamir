[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pamir-forensics"
version = "0.1.0"
description = "Post-Mission Autonomous Incident Reconstruction"
requires-python = ">=3.10"
dependencies = ["pyulog==1.2.4"]

[project.scripts]
pamir = "pamir.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["pamir"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
