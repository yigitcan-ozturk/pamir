name: field-validation-holdout-h10-availability
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: field-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/field_validation_holdout_h10_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: pamir-holdout-h10-availability
          path: field-validation/runtime/holdout-h10-probe/availability.json
