name: field-validation-holdout-h1-acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: field-validation}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Acquire H1 without PAMIR scoring
        run: python scripts/field_validation_holdout_acquire.py
      - uses: actions/upload-artifact@v4
        with:
          name: pamir-holdout-h1-acquisition
          path: field-validation/runtime/holdout-h1-acquisition/acquisition-results.json
          if-no-files-found: error
