name: Evidence OS Gate 01 (isolated)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/evidence-os/gate01/**'
      - '.github/workflows/evidence-os-gate01.yml'
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated contract tests
        working-directory: research/evidence-os/gate01
        run: python -m unittest discover -s tests -v
