name: field-validation-v2-incident-migration-audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: field-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyulog
      - run: PYTHONPATH=.:scripts python scripts/field_validation_v2_incident_migration_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pamir-v2-incident-migration-audit
          path: field-validation/runtime/v2-incident-migration-audit.json
