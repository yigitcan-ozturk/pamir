name: px4-benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-public-ulogs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download public PX4 benchmark logs
        run: python scripts/download_px4_benchmarks.py
      - name: Analyze public PX4 benchmark logs
        run: python scripts/validate_px4_benchmarks.py
      - name: Measure v0.2 public root stability
        run: python scripts/validate_v02_stability.py
      - name: Upload forensic benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pamir-px4-benchmark-reports
          path: benchmarks/reports/
          if-no-files-found: ignore


  field-validation-fv-a001:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/field-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Resolve FV-A001 from PX4 Flight Review
        run: |
          mkdir -p field-validation/runtime
          curl --fail --location --retry 3 --compressed -o field-validation/runtime/dbinfo.json https://review.px4.io/dbinfo
          python - <<'PY' > field-validation/runtime/source-url.txt
          import json
          uuid="d8852605-ac7e-46fa-bbff-8fd977b24f0e"
          rows=json.load(open("field-validation/runtime/dbinfo.json", encoding="utf-8"))
          for row in rows:
              if row.get("log_id") == uuid and row.get("download_url"):
                  print(row["download_url"])
                  raise SystemExit(0)
          raise SystemExit("FV-A001 UUID/download_url not found")
          PY
          curl --fail --location --retry 3 --compressed -o field-validation/runtime/input.ulg "$(cat field-validation/runtime/source-url.txt)"
      - name: Verify FV-A001 pinned SHA256
        run: echo "292cf51d34b9b1373a0208fd8c6585839625b0bede8f33b9043dc07fe7bc52db  field-validation/runtime/input.ulg" | sha256sum --check -
      - name: Frozen PAMIR replay 1
        run: pamir analyze field-validation/runtime/input.ulg -o field-validation/runtime/report-1.json
      - name: Frozen PAMIR replay 2
        run: pamir analyze field-validation/runtime/input.ulg -o field-validation/runtime/report-2.json
      - name: Determinism gate
        run: cmp field-validation/runtime/report-1.json field-validation/runtime/report-2.json
      - name: Upload FV-A001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pamir-field-validation-FV-A001
          path: |
            field-validation/runtime/source-url.txt
            field-validation/runtime/report-1.json
            field-validation/runtime/report-2.json
          if-no-files-found: ignore


  field-validation-fv-a002:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/field-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Resolve FV-A002 from PX4 Flight Review
        run: |
          mkdir -p field-validation/runtime/FV-A002
          curl --fail --location --retry 3 --compressed -o field-validation/runtime/FV-A002/dbinfo.json https://review.px4.io/dbinfo
          python - <<'PY' > field-validation/runtime/FV-A002/source-url.txt
          import json
          uuid="34c46166-8fee-4cb8-b7de-38517de4122b"
          rows=json.load(open("field-validation/runtime/FV-A002/dbinfo.json", encoding="utf-8"))
          for row in rows:
              if row.get("log_id") == uuid and row.get("download_url"):
                  print(row["download_url"])
                  raise SystemExit(0)
          # Historical Flight Review entries may no longer appear in /dbinfo.
          # Issue #9260 independently pins the UUID, so use PX4's canonical CDN
          # object path as a provenance-preserving fallback.
          print(f"https://cdn.logs.px4.io/{uuid}.ulg")
          PY
          curl --fail --location --retry 3 --compressed -o field-validation/runtime/FV-A002/input.ulg "$(cat field-validation/runtime/FV-A002/source-url.txt)"
          sha256sum field-validation/runtime/FV-A002/input.ulg | tee field-validation/runtime/FV-A002/input.sha256
      - name: Frozen PAMIR replay 1
        run: pamir analyze field-validation/runtime/FV-A002/input.ulg -o field-validation/runtime/FV-A002/report-1.json
      - name: Frozen PAMIR replay 2
        run: pamir analyze field-validation/runtime/FV-A002/input.ulg -o field-validation/runtime/FV-A002/report-2.json
      - name: Determinism gate
        run: cmp field-validation/runtime/FV-A002/report-1.json field-validation/runtime/FV-A002/report-2.json
      - name: Upload FV-A002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pamir-field-validation-FV-A002
          path: |
            field-validation/runtime/FV-A002/source-url.txt
            field-validation/runtime/FV-A002/input.sha256
            field-validation/runtime/FV-A002/report-1.json
            field-validation/runtime/FV-A002/report-2.json
          if-no-files-found: ignore
