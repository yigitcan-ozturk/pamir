name: field-validation-false-root-mechanisms

on:
  workflow_dispatch:

jobs:
  false-root-mechanisms:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: field-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Reproduce predeclared Corpus v1 threshold sweep
        run: python scripts/field_validation_threshold_sensitivity.py
      - name: Analyse healthy-control false-root mechanisms
        run: python scripts/field_validation_false_root_mechanisms.py
      - name: Preserve mechanism analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pamir-corpus-v1-false-root-mechanisms
          path: |
            field-validation/runtime/false-root-mechanisms.json
            field-validation/runtime/false-root-mechanisms.md
          if-no-files-found: error
