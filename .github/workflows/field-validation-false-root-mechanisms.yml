name: field-validation-false-root-mechanisms

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  false-root-mechanisms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: field-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download successful threshold-sensitivity evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p field-validation/runtime/reused
          gh run download 35953073198 \
            --repo "${{ github.repository }}" \
            --name pamir-corpus-v1-threshold-sensitivity \
            --dir field-validation/runtime/reused
          cp field-validation/runtime/reused/threshold-sensitivity-results.json \
             field-validation/runtime/threshold-sensitivity-results.json
      - name: Verify reused evidence digest
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("field-validation/runtime/threshold-sensitivity-results.json")
          print("threshold evidence sha256:", hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Analyse healthy-control false-root mechanisms
        run: python scripts/field_validation_false_root_mechanisms.py
      - name: Preserve mechanism analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pamir-corpus-v1-false-root-mechanisms
          path: |
            field-validation/runtime/false-root-mechanisms.json
            field-validation/runtime/false-root-mechanisms.md
          if-no-files-found: error
