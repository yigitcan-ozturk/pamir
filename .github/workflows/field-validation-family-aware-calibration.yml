name: field-validation-family-aware-calibration

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: field-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download verified threshold-sensitivity evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p field-validation/runtime/reused
          gh run download 35953073198 \
            --repo "${{ github.repository }}" \
            --name pamir-corpus-v1-threshold-sensitivity \
            --dir field-validation/runtime/reused
          cp field-validation/runtime/reused/threshold-sensitivity-results.json \
             field-validation/runtime/threshold-sensitivity-results.json
      - name: Run predeclared family-aware calibration proxy
        run: python scripts/field_validation_family_calibration.py
      - name: Upload calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: pamir-corpus-v1-family-aware-calibration
          path: |
            field-validation/runtime/family-aware-calibration.json
            field-validation/runtime/family-aware-calibration.md
          if-no-files-found: error
