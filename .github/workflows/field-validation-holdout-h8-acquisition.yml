name: field-validation-holdout-h8-acquisition
on:
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: field-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/field_validation_holdout_h8_acquire.py
      - uses: actions/upload-artifact@v4
        with:
          name: pamir-holdout-h8-acquisition
          path: field-validation/runtime/holdout-h8-acquisition/acquisition-results.json
